<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
</head>

<body>
  <nav class="navbar is-white has-shadow" aria-label="main navigation">
    <div class="navbar-brand">
      <a class="navbar-item has-text-weight-bold" href="{{ '/' | relative_url }}">
        <img src="./images/logo.png" />
      </a>
      <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="main-navbar">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </a>
    </div>

    <div id="main-navbar" class="navbar-menu">
      <div class="navbar-start">
        <a class="navbar-item" href="{{ '/' | relative_url }}">Home</a>
        <a class="navbar-item" href="{{ '/about.html' | relative_url }}">About</a>
      </div>
      <div class="navbar-end">
        <div class="navbar-item"></div>
      </div>
    </div>
  </nav>

  <main class="section">
    <div class="container">
      <div class="content">
        {{ content }}
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="columns">
      <div class="column is-four-fiths">        
        <p>&copy; {{ site.time | date: '%Y' }} RISM Digital Center - Hallwylstrasse 15 - Postfach 286 - CH-3000 Bern 6</p>
      </div>
      <div class="column is-one-fifth">
        <p></p>
      </div>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>

</html>
